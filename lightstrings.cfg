# LightStrings - Free Pascal compiler configuration (Tier 2: zero-install)
#
#   cd /path/to/LightStrings
#   fpc @lightstrings.cfg my_program.pas
#
# The -Fu paths below are relative to the current directory, so pass this file
# from the LightStrings checkout root (that also makes it work when
# LightStrings sits inside your project as a git submodule).
